<style>
@import url('https://fonts.cdnfonts.com/css/goudy-mediaeval');

:root {
  --fs-lg:  1.4rem;
  --fs-xl:  1.5rem;
  --fs-2xl: 1.8rem;
}

h1 { font-size: var(--fs-2xl); margin-bottom: 0.75rem; }
h2 { font-size: var(--fs-xl);  margin-top: 2rem; margin-bottom: 0.5rem; }
h3 { font-size: var(--fs-lg);  margin-top: 1.5rem; }

h1 a, h2 a, h3 a, h4 a, h5 a, h6 a {
  font-size: inherit;
  font-weight: inherit;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0.85;
  z-index: -1;
}
</style>
