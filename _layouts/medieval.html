---
layout: default
---
<style>
@import url('https://fonts.cdnfonts.com/css/goudy-mediaeval');

:root {
  --font-base:       "Goudy Mediaeval", sans-serif;
  --sidebar-width:   15%;

  --fs-sm:  1.2rem;
  --fs-md:  1.3rem;
  --fs-lg:  1.4rem;
  --fs-xl:  1.5rem;
  --fs-2xl: 1.8rem; 

  --color-bg:        #f5edd8;   
  --color-text:      #3a2e1e;   
  --color-link:      #6b3f22;   
  --color-nav-bg:    #ede0a0;   
  --color-nav-border:#b89a72; 
}

/* ── Base ── */
body {
  margin: 0;
  min-height: 100vh;
  padding: 1.5rem 2rem;
  font-family: var(--font-base);
  font-size: var(--fs-sm);
  color: var(--color-text);
  background-color: var(--color-bg);
  line-height: 1.75;
  max-width: 860px;
  position: relative;
  z-index: 0;
}

/* Fond décoratif */
body::before {
  content: "";
  position: fixed;
  inset: 0;               /* remplace top/left/width/height: 100% */
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0.85;
  z-index: -1;
}

/* ── Typographie ── */
/* font-size hérité de body pour p, li, a — plus besoin de le répéter */
h1 { font-size: var(--fs-2xl); }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }

/* Les liens dans les titres héritent de la taille du titre parent */
h1 a, h2 a, h3 a, h4 a, h5 a, h6 a {
  font-size: inherit;
  font-weight: inherit;
}

a {
  color: var(--color-link);
  text-decoration: none;
}
a:hover { text-decoration: underline; }

.nav-list-link { font-size: var(--fs-md); }

/* ── Navigation ── */
nav {
  background-color: var(--color-nav-bg);
  border: 1px solid var(--color-nav-border);
  padding: 1rem;
  font-family: var(--font-base);
  box-shadow: 2px 2px 8px rgb(0 0 0 / 20%);
}


h1 { margin-bottom: 0.75rem; }
h2 { margin-top: 2rem; margin-bottom: 0.5rem; }
h3 { margin-top: 1.5rem; }

p, li {
  margin-bottom: 0.4rem;
}

/* ── Layout ── */
.side-bar { width: var(--sidebar-width); }
.main     { margin-left: var(--sidebar-width); }
</style>
